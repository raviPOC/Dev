<template>
    <lightning-card title="Form Responses" icon-name="standard:survey">
        <div slot="actions">
            <lightning-combobox
                name="formSelector"
                placeholder="Select a form..."
                options={formOptions}
                value={selectedFormId}
                onchange={handleFormSelect}
                class="form-selector">
            </lightning-combobox>
        </div>

        <div class="slds-p-around_medium">
            <!-- Loading State -->
            <template if:true={isLoading}>
                <div class="slds-align_absolute-center slds-p-around_large">
                    <lightning-spinner alternative-text="Loading responses..."></lightning-spinner>
                </div>
            </template>

            <!-- No Form Selected -->
            <template if:false={isLoading}>
                <template if:false={selectedFormId}>
                    <div class="slds-text-align_center slds-p-around_large">
                        <lightning-icon 
                            icon-name="utility:survey" 
                            size="large"
                            class="slds-m-bottom_medium empty-icon">
                        </lightning-icon>
                        <h3 class="slds-text-heading_small slds-m-bottom_small">Select a Form</h3>
                        <p class="slds-text-body_regular slds-text-color_weak">
                            Choose a form from the dropdown to view its responses.
                        </p>
                    </div>
                </template>

                <!-- Responses Display -->
                <template if:true={selectedFormId}>
                    <!-- Summary Stats -->
                    <div class="slds-grid slds-wrap slds-m-bottom_medium">
                        <div class="slds-col slds-size_1-of-3 slds-p-around_small">
                            <div class="stat-card slds-box slds-text-align_center">
                                <p class="slds-text-heading_large">{totalResponses}</p>
                                <p class="slds-text-body_small slds-text-color_weak">Total Responses</p>
                            </div>
                        </div>
                        <div class="slds-col slds-size_1-of-3 slds-p-around_small">
                            <div class="stat-card slds-box slds-text-align_center">
                                <p class="slds-text-heading_large">{responsesToday}</p>
                                <p class="slds-text-body_small slds-text-color_weak">Today</p>
                            </div>
                        </div>
                        <div class="slds-col slds-size_1-of-3 slds-p-around_small">
                            <div class="stat-card slds-box slds-text-align_center">
                                <p class="slds-text-heading_large">{responsesThisWeek}</p>
                                <p class="slds-text-body_small slds-text-color_weak">This Week</p>
                            </div>
                        </div>
                    </div>

                    <!-- Responses Table -->
                    <template if:true={hasResponses}>
                        <lightning-datatable
                            key-field="Id"
                            data={formattedResponses}
                            columns={responseColumns}
                            onrowaction={handleRowAction}
                            show-row-number-column
                            sorted-by={sortedBy}
                            sorted-direction={sortedDirection}
                            onsort={handleSort}>
                        </lightning-datatable>
                    </template>

                    <template if:false={hasResponses}>
                        <div class="slds-text-align_center slds-p-around_large slds-box slds-theme_shade">
                            <p class="slds-text-body_regular slds-text-color_weak">
                                No responses have been submitted for this form yet.
                            </p>
                        </div>
                    </template>
                </template>
            </template>
        </div>
    </lightning-card>

    <!-- Response Detail Modal -->
    <template if:true={showDetailModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_medium">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={handleCloseDetailModal}>
                        <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-modal__title">Response Details</h2>
                    <p class="slds-text-body_small slds-text-color_inverse-weak slds-m-top_xx-small">
                        {selectedResponse.Name} - Submitted {selectedResponse.formattedDate}
                    </p>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <template if:true={selectedResponseFields}>
                        <dl class="slds-list_horizontal slds-wrap">
                            <template for:each={selectedResponseFields} for:item="field">
                                <div key={field.key} class="slds-col slds-size_1-of-1 slds-p-vertical_x-small response-field">
                                    <dt class="slds-text-title_caps slds-text-color_weak">
                                        {field.label}
                                    </dt>
                                    <dd class="slds-text-body_regular slds-m-top_xx-small">
                                        <template if:true={field.isArray}>
                                            <ul class="slds-list_dotted">
                                                <template for:each={field.arrayValue} for:item="item">
                                                    <li key={item}>{item}</li>
                                                </template>
                                            </ul>
                                        </template>
                                        <template if:true={field.isBoolean}>
                                            <lightning-icon 
                                                icon-name={field.booleanIcon} 
                                                size="x-small"
                                                class={field.booleanClass}>
                                            </lightning-icon>
                                            {field.booleanLabel}
                                        </template>
                                        <template if:false={field.isArray}>
                                            <template if:false={field.isBoolean}>
                                                {field.displayValue}
                                            </template>
                                        </template>
                                    </dd>
                                </div>
                            </template>
                        </dl>
                    </template>

                    <template if:true={selectedResponse.Target_Record_Id__c}>
                        <div class="slds-m-top_medium slds-box slds-theme_success">
                            <lightning-icon icon-name="utility:check" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            Record created: 
                            <a href={targetRecordUrl} target="_blank">{selectedResponse.Target_Record_Id__c}</a>
                        </div>
                    </template>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Close" onclick={handleCloseDetailModal}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
