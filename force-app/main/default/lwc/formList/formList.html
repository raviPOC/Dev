<template>
    <lightning-card title="Available Forms" icon-name="custom:custom63">
        <div slot="actions">
            <lightning-button
                label="Refresh"
                icon-name="utility:refresh"
                onclick={handleRefresh}>
            </lightning-button>
        </div>

        <div class="slds-p-around_medium">
            <!-- Loading State -->
            <template if:true={isLoading}>
                <div class="slds-align_absolute-center slds-p-around_large">
                    <lightning-spinner alternative-text="Loading forms..."></lightning-spinner>
                </div>
            </template>

            <!-- Forms List -->
            <template if:false={isLoading}>
                <template if:true={hasForms}>
                    <div class="form-grid">
                        <template for:each={activeForms} for:item="form">
                            <div key={form.Id} class="form-card slds-box slds-p-around_medium slds-m-bottom_small">
                                <div class="form-card-header slds-m-bottom_small">
                                    <h3 class="slds-text-heading_small slds-truncate" title={form.Name}>
                                        {form.Name}
                                    </h3>
                                    <template if:true={form.Description__c}>
                                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small slds-line-clamp_2">
                                            {form.Description__c}
                                        </p>
                                    </template>
                                </div>
                                
                                <div class="form-card-meta slds-m-bottom_small">
                                    <template if:true={form.Target_Object__c}>
                                        <lightning-badge 
                                            label={form.Target_Object__c}
                                            class="slds-m-right_xx-small">
                                        </lightning-badge>
                                    </template>
                                    <span class="slds-text-body_small slds-text-color_weak">
                                        Updated: {form.formattedDate}
                                    </span>
                                </div>

                                <div class="form-card-actions">
                                    <lightning-button
                                        label="Fill Out Form"
                                        variant="brand"
                                        data-form-id={form.Id}
                                        onclick={handleOpenForm}>
                                    </lightning-button>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>

                <template if:false={hasForms}>
                    <div class="slds-text-align_center slds-p-around_large">
                        <lightning-icon 
                            icon-name="utility:form" 
                            size="large"
                            class="slds-m-bottom_medium empty-icon">
                        </lightning-icon>
                        <h3 class="slds-text-heading_small slds-m-bottom_small">No Forms Available</h3>
                        <p class="slds-text-body_regular slds-text-color_weak">
                            There are no active forms available at this time.
                        </p>
                    </div>
                </template>
            </template>
        </div>
    </lightning-card>

    <!-- Form Modal -->
    <template if:true={showFormModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_large">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={handleCloseModal}>
                        <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-modal__title">{selectedFormName}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium" style="min-height: 400px;">
                    <c-form-renderer
                        form-definition-id={selectedFormId}
                        onformsubmit={handleFormSubmit}>
                    </c-form-renderer>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Close" onclick={handleCloseModal}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
